name: Pixel Experience A13 Custom Kernel

on:
  workflow_dispatch:
    inputs:
      RELEASE_CONFIG:
        description: 'Upload to Releases'
        required: true
        default: false
        type: boolean
      KERNEL_SOURCE:
        description: 'Kernel Source'
        required: true
        default: "https://github.com/PixelExperience-Devices/kernel_oneplus_martini.git"
        type: string
      KERNEL_SOURCE_BRANCH:
        description: 'Kernel Branch'
        required: true
        default: "thirteen"
        type: string
      KERNEL_DEFCONFIG:
        description: 'Kernel Config'
        required: true
        default: "vendor/lahaina-qgki_defconfig"
        type: string
      KERNELSU_CONFIG:
        description: 'Compile KernelSU'
        required: true
        default: true
        type: boolean
      CCACHE_CONFIG:
        description: 'Use Ccache'
        required: true
        default: true
        type: boolean
      KERNELSU_TAG:
        description: 'KernelSU branch or tag'
        required: false
        default: "a943528d8203f2bcd524bddb273fb3c00905ea67"
        type: string
      VOLTAGE_DIAGNOSTIC:
        description: 'Add QCOM CPU voltage-table diagnostic logging'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Ccache
        if: github.event.inputs.CCACHE_CONFIG == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: Pixel-Experience-A13

      - name: Setup Environment
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zip

          # Python 2 is required by the legacy DTBO build scripts.
          git clone https://github.com/pyenv/pyenv.git ~/.pyenv
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv install 2.7.18
          pyenv global 2.7.18
          echo "$PYENV_ROOT/shims" >> "$GITHUB_PATH"

          echo "=== PYTHON CHECK ==="
          which python2
          python2 --version

          export CLANG_PATH="$HOME/clang"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$CLANG_PATH"
          echo "=== CLANG CHECK ==="
          "$CLANG_PATH/bin/clang" --version
          "$CLANG_PATH/bin/ld.lld" --version | head -n 1

      - name: Git kernel
        run: |
          set -e
          git clone "${{ github.event.inputs.KERNEL_SOURCE }}" \
            -b "${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}" \
            kernel --depth=1
          SUBLEVEL=$(grep '^SUBLEVEL =' kernel/Makefile | awk '{print $3}' || echo "0")
          echo "TAG_NAME=PE-A13-martini-v5.4.${SUBLEVEL}-$(date +"%Y%m%d")" >> "$GITHUB_ENV"

          echo "=== KERNEL SOURCE ==="
          cd kernel
          git log -1 --oneline
          echo "=== BRANCH ==="
          git branch --show-current || true

      - name: Setup KernelSU
        if: github.event.inputs.KERNELSU_CONFIG == 'true'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ github.event.inputs.KERNELSU_TAG }}"
          scripts/config --file "arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}" \
            -e MODULES -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS

      - name: Add CPU voltage-table diagnostics
        if: github.event.inputs.VOLTAGE_DIAGNOSTIC == 'true'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/cpufreq/qcom-cpufreq-hw.c")
          s = p.read_text()
          needle = "\t\tvolt = FIELD_GET(LUT_VOLT, data) * 1000;"
          inject = needle + '\n\t\tpr_info("QCOM-UV: idx=%d freq=%u kHz volt=%u uV\\n", i, freq, volt);'

          if "QCOM-UV: idx=" in s:
              print("QCOM-UV diagnostic already present")
          elif needle in s:
              s = s.replace(needle, inject, 1)
              p.write_text(s)
              print("QCOM-UV diagnostic inserted")
          else:
              raise SystemExit("Could not find the expected voltage-LUT line in drivers/cpufreq/qcom-cpufreq-hw.c")
          PY

          echo "=== QCOM-UV CHECK ==="
          grep -n -C 2 'QCOM-UV:' drivers/cpufreq/qcom-cpufreq-hw.c

      - name: Make kernel
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          export KERNEL_DEFCONFIG="${{ github.event.inputs.KERNEL_DEFCONFIG }}"
          export KERNEL_PATH="$PWD"
          export CLANG_PATH="$HOME/clang"
          export PATH="${CLANG_PATH}/bin:${PATH}"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export ARCH=arm64
          export SUBARCH=arm64

          echo "=================== PYTHON2 CHECK IN MAKE STEP ==================="
          which python2
          python2 --version

          echo "=================== Generating defconfig ==================="
          make O=out \
            CC="ccache $CLANG_PATH/bin/clang" \
            CXX="ccache $CLANG_PATH/bin/clang++" \
            HOSTCC="gcc -B/usr/bin" \
            HOSTCXX="g++ -B/usr/bin" \
            HOSTLD="/usr/bin/ld" \
            ARCH=arm64 \
            CROSS_COMPILE="$CLANG_PATH/bin/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$CLANG_PATH/bin/arm-linux-gnueabi-" \
            LD=ld.lld \
            "$KERNEL_DEFCONFIG"

          echo "=================== Disabling LTO ==================="
          scripts/config --file out/.config -d LTO -d LTO_CLANG -d THINLTO -e LTO_NONE

          echo "=================== Building kernel with reduced parallelism ==================="
          set -o pipefail
          make O=out \
            CC="ccache $CLANG_PATH/bin/clang" \
            CXX="ccache $CLANG_PATH/bin/clang++" \
            HOSTCC="gcc -B/usr/bin" \
            HOSTCXX="g++ -B/usr/bin" \
            HOSTLD="/usr/bin/ld" \
            ARCH=arm64 \
            -j2 \
            CROSS_COMPILE="$CLANG_PATH/bin/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$CLANG_PATH/bin/arm-linux-gnueabi-" \
            LD=ld.lld \
            2>&1 | tee kernel.log

          echo "=================== SEARCHING ERRORS ==================="
          grep -nEi "error:|fatal:|undefined reference|No such file|cannot find|ld:|clang: error|gcc: error" kernel.log | tail -n 50 || true

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Build failed – Image not found"
            echo "Last 80 lines of kernel.log:"
            tail -n 80 kernel.log
            exit 1
          fi

          echo "✅ Kernel Image built successfully"
          ls -lh out/arch/arm64/boot/Image

      - name: Create AnyKernel3 package
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          export KERNEL_PATH="$PWD"
          git clone https://gitlab.com/inferno0230/AnyKernel3.git --depth=1 "$KERNEL_PATH/AnyKernel3"

          if [ -f "$KERNEL_PATH/out/arch/arm64/boot/Image" ] && [ -d "$KERNEL_PATH/AnyKernel3" ]; then
            zip_name="PixelExperience-A13-martini-${{ env.TAG_NAME }}.zip"
            cd "$KERNEL_PATH/AnyKernel3"
            cp "$KERNEL_PATH/out/arch/arm64/boot/Image" .
            zip -r "$zip_name" *
            mv "$zip_name" "$KERNEL_PATH/out/arch/arm64/boot/"

            echo "=== PACKAGE CHECK ==="
            unzip -l "$KERNEL_PATH/out/arch/arm64/boot/$zip_name" | grep -E '(^|/)Image$' || {
              echo "❌ Image missing from AnyKernel package"
              exit 1
            }
            echo "✅ ZIP created: $KERNEL_PATH/out/arch/arm64/boot/$zip_name"
          else
            echo "❌ Image or AnyKernel3 not found – build failed"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelExperience-A13-martini-${{ env.TAG_NAME }}
          path: kernel/out/arch/arm64/boot/PixelExperience-A13-martini-${{ env.TAG_NAME }}.zip
          if-no-files-found: error

      - name: Upload to Release
        if: github.event.inputs.RELEASE_CONFIG == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "kernel/out/arch/arm64/boot/PixelExperience-A13-martini-${{ env.TAG_NAME }}.zip"
          tag: "ONEPLUS9RT-PE-A13-${{ env.TAG_NAME }}"
          name: "Pixel Experience A13 martini ${{ env.TAG_NAME }}"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
