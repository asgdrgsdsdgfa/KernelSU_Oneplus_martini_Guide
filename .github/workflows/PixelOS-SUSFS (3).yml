name: Pixel OS SUSFS

on:
  workflow_dispatch:
    inputs:
      RELEASE_CONFIG:
        description: 'Upload to Releases'
        required: true
        default: false
        type: boolean
      KERNEL_SOURCE:
        description: 'Kernel Source'
        required: true
        default: "https://github.com/asgdrgsdsdgfa/android_kernel_oneplus_sm8350.git"
        type: string
      KERNEL_SOURCE_BRANCH:
        description: 'kernel Branch'
        required: true
        default: "fourteen-qpr3"
        type: string
      KERNEL_DEFCONFIG:
        description: 'Kernel Config'
        required: true
        default: "vendor/lahaina-qgki_defconfig"
        type: string
      KERNELSU_CONFIG:
        description: 'Compile KernelSU'
        required: true
        default: true
        type: boolean          
      CCACHE_CONFIG:
        description: 'Use Ccache'
        required: true
        default: true
        type: boolean
      KERNELSU_TAG:
        description: 'Choose KernelSU branch or tag'
        required: false
        default: "main"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Ccache
        if: github.event.inputs.CCACHE_CONFIG == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: PixelOS-inline

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zip

          git clone https://github.com/pyenv/pyenv.git ~/.pyenv

          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"

          eval "$(pyenv init -)"

          pyenv install 2.7.18
          pyenv global 2.7.18

          echo "$PYENV_ROOT/shims" >> "$GITHUB_PATH"

          echo "=== PYTHON CHECK ==="
          which python2
          python2 --version
          ls -l "$PYENV_ROOT/shims/python2"

          python2 --version

          export CLANG_PATH=$HOME/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$CLANG_PATH"
          
      - name: Git kernel
        run: |
          git clone "${{ github.event.inputs.KERNEL_SOURCE }}" -b "${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}" kernel --depth=1
          SUBLEVEL=$(grep "^SUBLEVEL =" kernel/Makefile | awk '{print $3}' || echo "0")
          echo "TAG_NAME=v5.4.${SUBLEVEL}-$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Setup KernelSU
        if: github.event.inputs.KERNELSU_CONFIG == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel
          git clone https://github.com/natsumerinchan/KernelSU.git KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ github.event.inputs.KERNELSU_TAG }}"
          scripts/config --file "arch/arm64/configs/${{ github.event.inputs.KERNEL_DEFCONFIG }}" -e MODULES -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS

      - name: Make kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export KERNEL_DEFCONFIG=${{ github.event.inputs.KERNEL_DEFCONFIG }}
          export KERNEL_PATH=$PWD
          export CLANG_PATH=~/clang
          export PATH=${CLANG_PATH}/bin:${PATH}
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export ARCH=arm64
          export SUBARCH=arm64

          if [ ! -e "$CLANG_PATH/README.md" ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang $CLANG_PATH
          fi

          echo "=================== Generating defconfig ==================="
                    echo "=== PYTHON2 CHECK IN MAKE STEP ==="
          which python2
          python2 --version
          make O=out \
            CC="ccache $CLANG_PATH/bin/clang" \
            CXX="ccache $CLANG_PATH/bin/clang++" \
            HOSTCC="gcc -B/usr/bin" \
            HOSTCXX="g++ -B/usr/bin" \
            HOSTLD="/usr/bin/ld" \
            ARCH=arm64 \
            CROSS_COMPILE=$CLANG_PATH/bin/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$CLANG_PATH/bin/arm-linux-gnueabi- \
            LD=ld.lld \
            $KERNEL_DEFCONFIG

          echo "=================== Disabling LTO ==================="
          scripts/config --file out/.config -d LTO -d LTO_CLANG -d THINLTO -e LTO_NONE

          echo "=================== Building kernel with reduced parallelism ==================="
          set -o pipefail
          make O=out \
            CC="ccache $CLANG_PATH/bin/clang" \
            CXX="ccache $CLANG_PATH/bin/clang++" \
            HOSTCC="gcc -B/usr/bin" \
            HOSTCXX="g++ -B/usr/bin" \
            HOSTLD="/usr/bin/ld" \
            ARCH=arm64 \
            -j2 \
            CROSS_COMPILE=$CLANG_PATH/bin/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$CLANG_PATH/bin/arm-linux-gnueabi- \
            LD=ld.lld \
            2>&1 | tee kernel.log

          echo "=================== SEARCHING ERRORS ==================="
          grep -nEi "error:|fatal:|undefined reference|No such file|cannot find|ld:|clang: error|gcc: error" kernel.log | tail -n 50 || true

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Build failed – Image not found"
            echo "Last 50 lines of kernel.log:"
            tail -n 50 kernel.log
            exit 1
          fi
          echo "✅ Kernel Image built successfully"

      - name: Create Anykernel3 file
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export KERNEL_PATH=$PWD
          git clone https://gitlab.com/inferno0230/AnyKernel3.git --depth=1 $KERNEL_PATH/AnyKernel3
          if [ -f $KERNEL_PATH/out/arch/arm64/boot/Image ] && [ -d $KERNEL_PATH/AnyKernel3 ]; then
             zip_name="PixelOS-SUSFS-martini-${{ env.TAG_NAME }}.zip"
             cd $KERNEL_PATH/AnyKernel3
             cp $KERNEL_PATH/out/arch/arm64/boot/Image .
             zip -r ${zip_name} *
             mv ${zip_name} $KERNEL_PATH/out/arch/arm64/boot/
             echo "✅ ZIP created: $KERNEL_PATH/out/arch/arm64/boot/${zip_name}"
          else
             echo "❌ Image or AnyKernel3 not found – build failed"
             exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-SUSFS-martini-${{ env.TAG_NAME }}
          path: kernel/out/arch/arm64/boot/PixelOS-SUSFS-martini-${{ env.TAG_NAME }}.zip
          if-no-files-found: error

      - name: Upload to Release
        if: github.event.inputs.RELEASE_CONFIG == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "kernel/out/arch/arm64/boot/PixelOS-SUSFS-martini-${{ env.TAG_NAME }}.zip"
          tag: "ONEPLUS9RT-PixelOS-SUSFS-${{ env.TAG_NAME }}"
          name: "PixelOS SUSFS martini ${{ env.TAG_NAME }}"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
